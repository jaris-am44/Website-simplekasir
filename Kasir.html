<!DOCTYPE html>
<html lang="id">

<head>
    <!-- Pengaturan dasar halaman -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Judul halaman -->
    <title>Simple Kasir</title>

    <!-- Menghubungkan file CSS -->
    <link rel="stylesheet" href="Kasir.css">
</head>

<body>

<!-- Kotak utama kasir -->
<div class="container">

    <!-- Judul dan subjudul -->
    <h1>Simple Kasir</h1>
    <p class="subtitle">Sistem Kasir Sederhana</p>


    <!-- Pilihan nama barang -->
    <label>Nama Barang</label>
    <select id="namaBarang" onchange="cekBarang()">
        <option value="">-- Pilih Barang --</option>
        <option value="laptop">Laptop</option>
        <option value="mouse">Mouse</option>
        <option value="keyboard">Keyboard</option>
        <option value="monitor">Monitor</option>
        <option value="headset">Headset</option>
        <option value="flashdisk">Flashdisk</option>
    </select>


    <!-- Input harga barang -->
    <label>Harga</label>
    <input type="number" id="hargaBarang" placeholder="Harga barang">


    <!-- Input jumlah barang -->
    <label>Jumlah</label>
    <input type="number" id="jumlahBarang" placeholder="Jumlah barang">


    <!-- Tombol tambah barang -->
    <button onclick="tambahBarang()">+ Tambah Barang</button>


    <!-- Daftar belanja / keranjang -->
    <div class="keranjang">
        <h2>Daftar Belanja</h2>

        <!-- Tabel daftar barang -->
        <table>
            <thead>
                <tr>
                    <th>Barang</th>
                    <th>Harga</th>
                    <th>Qty</th>
                    <th>Subtotal</th>
                    <th>Aksi</th>
                </tr>
            </thead>

            <!-- Tempat daftar barang ditampilkan -->
            <tbody id="daftarKeranjang">
            </tbody>
        </table>
    </div>


    <!-- Hasil perhitungan transaksi -->
    <div class="hasil">

        <!-- Subtotal -->
        <div class="baris">
            <span>Subtotal</span>
            <span id="hasilSubtotal">Rp0</span>
        </div>

        <!-- Diskon -->
        <div class="baris">
            <span>Diskon</span>
            <span id="hasilDiskon">Rp0</span>
        </div>

        <!-- Total -->
        <div class="baris total">
            <span>Total</span>
            <span id="hasilTotal">Rp0</span>
        </div>

    </div>


    <!-- Input uang pelanggan -->
    <label>Uang Pelanggan</label>
    <input type="number" id="uangPelanggan"
           placeholder="Masukkan uang pelanggan">


    <!-- Tombol hitung pembayaran -->
    <button onclick="hitungKembalian()">Hitung Pembayaran</button>


    <!-- Hasil pembayaran -->
    <div class="hasil pembayaran">

        <!-- Uang yang diberikan pelanggan -->
        <div class="baris">
            <span>Uang Pelanggan</span>
            <span id="hasilUangPelanggan">Rp0</span>
        </div>

        <!-- Uang kembalian -->
        <div class="baris total">
            <span>Kembalian</span>
            <span id="hasilKembalian">Rp0</span>
        </div>

    </div>


    <!-- Tombol reset transaksi -->
    <button class="reset" onclick="resetKasir()">
        Reset Transaksi
    </button>

</div>


<!-- Menghubungkan file JavaScript -->
<script src="Kasir.js"></script>

</body>
</html>
